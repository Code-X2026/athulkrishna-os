<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <rect width="1000" height="750" fill="#ffffff" />
  
  <!-- Outer Double Border -->
  <rect x="25" y="25" width="950" height="700" fill="none" stroke="#607d8b" stroke-width="4" />
  <rect x="35" y="35" width="930" height="680" fill="none" stroke="#90a4ae" stroke-width="1.5" />

  <!-- Cisco Logo Top Left -->
  <g transform="translate(70, 75)">
    <!-- Cisco Bars -->
    <path d="M5 25 v-15 M12 25 v-20 M19 25 v-10 M26 25 v-25 M33 25 v-10 M40 25 v-20 M47 25 v-15" stroke="#005073" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="42" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" fill="#005073" letter-spacing="2">CISCO</text>
  </g>

  <!-- Title Header -->
  <text x="500" y="155" text-anchor="middle" font-family="'Georgia', serif" font-size="32" fill="#37474f">Cisco Certifications</text>
  
  <!-- Candidate Name -->
  <text x="500" y="215" text-anchor="middle" font-family="'Arial', sans-serif" font-size="34" font-weight="bold" fill="#102a43" letter-spacing="1.5">ATHUL KRISHNA O S</text>

  <!-- Subtitle -->
  <text x="500" y="260" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#52606d">has successfully completed the Cisco certification exam requirements and is recognized as a</text>

  <!-- Main Certification Title -->
  <text x="500" y="315" text-anchor="middle" font-family="'Arial', sans-serif" font-size="30" font-weight="bold" fill="#0b2942">Cisco Certified Network Associate</text>

  <!-- Central CCNA Seal Graphic -->
  <g transform="translate(500, 420)">
    <!-- Shield / Seal Contour -->
    <path d="M -60 -45 C -40 -65 40 -65 60 -45 C 60 10 30 50 0 65 C -30 50 -60 10 -60 -45 Z" fill="none" stroke="#102a43" stroke-width="2.5" />
    <path d="M -52 -40 C -35 -57 35 -57 52 -40 C 52 8 26 42 0 55 C -26 42 -52 8 -52 -40 Z" fill="none" stroke="#102a43" stroke-width="1.2" />
    <text x="0" y="-22" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#102a43" letter-spacing="2">CISCO</text>
    <text x="0" y="-8" text-anchor="middle" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="#102a43" letter-spacing="1.5">CERTIFIED</text>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#102a43" stroke-width="1" />
    <text x="0" y="24" text-anchor="middle" font-family="'Arial', sans-serif" font-size="22" font-weight="extrabold" fill="#102a43" letter-spacing="1">CCNA</text>
  </g>

  <!-- Certificate Details Left -->
  <g transform="translate(380, 560)" font-family="'Arial', sans-serif" font-size="14" fill="#334e68">
    <text x="0" y="0" text-anchor="end">Date Certified</text>
    <text x="25" y="0" text-anchor="start" font-weight="bold" fill="#102a43">June 23, 2026</text>

    <text x="0" y="24" text-anchor="end">Valid Through</text>
    <text x="25" y="24" text-anchor="start" font-weight="bold" fill="#102a43">June 23, 2029</text>

    <text x="0" y="48" text-anchor="end">Cisco ID No.</text>
    <text x="25" y="48" text-anchor="start" font-weight="bold" fill="#102a43">CSCO15240575</text>
  </g>

  <!-- Signature Right -->
  <g transform="translate(730, 560)">
    <!-- Cursive Signature Mock -->
    <path d="M 0 10 Q 25 -15 45 5 T 90 -5 T 120 10 T 150 0" fill="none" stroke="#003366" stroke-width="2" />
    <text x="0" y="32" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#102a43">Chuck Robbins</text>
    <text x="0" y="48" font-family="'Arial', sans-serif" font-size="11" fill="#627d98">Chair and Chief Executive Officer</text>
    <text x="0" y="62" font-family="'Arial', sans-serif" font-size="11" fill="#627d98">Cisco Systems, Inc.</text>
  </g>

  <!-- Footer Verification Details -->
  <g transform="translate(70, 675)" font-family="'Arial', sans-serif" font-size="11" fill="#486581">
    <text x="0" y="0">Validate this certificate's authenticity at</text>
    <text x="0" y="15" font-weight="bold" fill="#005073">www.cisco.com/go/verifycertificate</text>
    <text x="0" y="30">Certificate Verification No. <tspan font-weight="bold" fill="#102a43">1b57ceb3c4cd49c4869e273fa3e9b8ef</tspan></text>
  </g>

  <text x="70" y="720" font-family="'Arial', sans-serif" font-size="9" fill="#829ab1">© 2026 Cisco and/or its affiliates</text>
</svg>
